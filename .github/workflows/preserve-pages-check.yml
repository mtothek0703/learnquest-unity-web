name: Verify historical Pages preservation
on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/preserve_legacy_pages.py'
      - '.github/scripts/test_preserve_legacy_pages.py'
      - '.github/workflows/publish-unity-webgl.yml'
      - '.github/workflows/preserve-pages-check.yml'
  pull_request:
    paths:
      - '.github/scripts/preserve_legacy_pages.py'
      - '.github/scripts/test_preserve_legacy_pages.py'
      - '.github/workflows/publish-unity-webgl.yml'
      - '.github/workflows/preserve-pages-check.yml'
permissions:
  contents: read
jobs:
  preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run offline archive regression tests
        run: python -m unittest discover -s .github/scripts -p 'test_preserve_legacy_pages.py' -v
      - name: Verify immutable version deployment wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path(".github/workflows/publish-unity-webgl.yml").read_text()
          assert "python .github/scripts/preserve_legacy_pages.py" in text
          assert "cp -a _site/godot/. _site/skyway-v24/" in text
          assert 'root = Path("_site/skyway-v24")' in text
          assert "/skyway-v24/" in text
          assert "Skyway V24 already exists: refusing to overwrite" in text
          for old in ("skyway-v23", "skyway-v22", "skyway-v21", "skyway-v20", "skyway-v19", "skyway-v18", "skyway-v17", "skyway-v16", "skyway-v15", "skyway-v10", "neon-city-v3"):
              assert f"cp -a _site/godot/. _site/{old}/" not in text
          print("Immutable historical-version wiring verified")
          PY

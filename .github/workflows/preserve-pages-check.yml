name: Verify historical Pages preservation
on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/preserve_legacy_pages.py'
      - '.github/scripts/test_preserve_legacy_pages.py'
      - '.github/workflows/publish-unity-webgl.yml'
      - '.github/workflows/preserve-pages-check.yml'
  pull_request:
    paths:
      - '.github/scripts/preserve_legacy_pages.py'
      - '.github/scripts/test_preserve_legacy_pages.py'
      - '.github/workflows/publish-unity-webgl.yml'
      - '.github/workflows/preserve-pages-check.yml'
permissions:
  contents: read
jobs:
  preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run offline archive regression tests
        run: python -m unittest discover -s .github/scripts -p 'test_preserve_legacy_pages.py' -v
      - name: Verify immutable version deployment wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path(".github/workflows/publish-unity-webgl.yml").read_text()
          assert "python .github/scripts/preserve_legacy_pages.py" in text
          # Only one new immutable release may be created per deployment.
          # Derive its name from the copy target, rather than pinning the
          # regression test to the previous Skyway release forever.
          copies = re.findall(r"cp -a _site/godot/\\. _site/(skyway-v\\d+)/", text)
          assert len(copies) == 1, f"Expected one versioned export, found {copies}"
          release = copies[0]
          version = release.replace("skyway-v", "Skyway V")
          assert f'root = Path("_site/{release}")' in text
          assert f"/{release}/" in text
          assert f"{version} already exists: refusing to overwrite" in text
          assert f'mkdir -p _site/{release}' in text
          assert f'echo "$GITHUB_SHA" > _site/{release}/build.txt' in text
          print(f"Immutable {release} deployment wiring verified")
          PY

name: Publish Unity WebGL Test
on:
  push:
    branches: [main]
    paths:
      - 'LearnQuest3D_WebGL_Testfix.zip'
      - '.github/scripts/prepare_webgl.py'
      - '.github/workflows/publish-unity-webgl.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install WebGL preparation dependency
        run: python -m pip install --disable-pip-version-check brotli
      - name: Prepare Unity website and repair missing IDBFS
        run: python .github/scripts/prepare_webgl.py LearnQuest3D_WebGL_Testfix.zip _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

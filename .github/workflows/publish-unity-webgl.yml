      - name: Check Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          url = "https://api.github.com/repos/" + os.environ["GH_REPOSITORY"] + "/pages"
          request = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "LearnQuest-deployment-check",
          })
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as error:
              print(f"::error::Cannot read GitHub Pages configuration (HTTP {error.code}). Open repository Settings > Pages and set Source to GitHub Actions.")
              raise SystemExit(1)
          source = data.get("build_type", "")
          print("Pages URL:", data.get("html_url", "not assigned"))
          print("Pages build type:", source)
          if source != "workflow":
              print("::error::GitHub Pages is not set to GitHub Actions. In Settings > Pages, choose Source: GitHub Actions.")
              raise SystemExit(1)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published game and revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, time, urllib.request, urllib.error
          root = "https://mtothek0703.github.io/learnquest-unity-web/skyway-v128/"
          checks = {"build.txt": os.environ["EXPECTED_SHA"], "index.html": None, "index.js": None, "index.wasm": None, "index.pck": None}
          for name, expected in checks.items():
              for attempt in range(12):
                  try:
                      req = urllib.request.Request(root + name + "?deploy=" + os.environ["EXPECTED_SHA"], headers={"Cache-Control": "no-cache"})
                      with urllib.request.urlopen(req, timeout=20) as response:
                          body = response.read() if expected else response.read(256)
                          if expected and body.decode().strip() != expected:
                              raise ValueError("Old revision still published")
                          if not body:
                              raise ValueError("Empty game file")
                          print(f"Verified {name}: HTTP {response.status}")
                          break
                  except Exception as exc:
                      if attempt == 11:
                          raise RuntimeError(f"Pages publication failed for {name}: {exc}. Check Settings > Pages (GitHub Actions as source), Pages permissions, and the Deploy Pages job.") from exc
                      time.sleep(10)
          PY

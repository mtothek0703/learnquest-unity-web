name: Publish LearnQuest Web Games
on:
  push:
    branches: [main]
    paths:
      - 'LearnQuest3D_WebGL_Testfix.zip'
      - 'godot/**'
      - '.github/scripts/prepare_webgl.py'
      - '.github/workflows/publish-unity-webgl.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Unity website
        # Fail closed: never deploy a new Pages artifact without the Unity site.
        run: |
          python -m pip install --disable-pip-version-check brotli
          python .github/scripts/prepare_webgl.py LearnQuest3D_WebGL_Testfix.zip _site
          test -s _site/index.html
          test -n "$(find _site/Build -name '*.wasm' -print -quit)"
      - name: Install free Godot editor and web export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Detect previously lost V34 release
        id: historical_v34
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          url = "https://mtothek0703.github.io/learnquest-unity-web/skyway-v34/index.html"
          try:
              with urlopen(Request(url, headers={"Cache-Control": "no-cache"}), timeout=20):
                  missing = False
          except HTTPError as error:
              if error.code != 404:
                  raise
              missing = True
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("missing=" + str(missing).lower() + "\n")
          print("Original V34 archive restoration required:", missing)
          PY
      - name: Retrieve original V34 Pages artifact
        if: steps.historical_v34.outputs.missing == 'true'
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 40053310388
          github-token: ${{ github.token }}
          path: /tmp/skyway-v34-original
      - name: Restore original V34 bytes without rebuilding
        if: steps.historical_v34.outputs.missing == 'true'
        run: python .github/scripts/restore_skyway_v34.py
      - name: Export Godot browser game
        shell: bash
        run: |
          # Do not let tee conceal a failed Godot import, export or gameplay test.
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/_site/godot"
          echo "Import Godot project and capture errors"
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path godot --quit 2>&1 | tee /tmp/godot-import.log
          echo "Export self-contained Godot browser build"
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --export-release "Web" "$GITHUB_WORKSPACE/_site/godot/index.html" 2>&1 | tee /tmp/godot-export.log
          test -s _site/godot/index.html
          test -s _site/godot/index.wasm
          test -s _site/godot/index.pck
          echo "Godot import/export finished with nonempty web files"
          echo "Run Godot scene smoke test"
          set +e
          timeout 35s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --quit-after 15 > /tmp/godot-smoke.log 2>&1
          smoke_status=$?
          set -e
          cat /tmp/godot-smoke.log
          if [ "$smoke_status" -ne 0 ]; then
            echo "::error::Godot smoke test exited with status $smoke_status"
            exit 1
          fi
          # Runtime warnings from the headless graphics driver are not gameplay failures.
          # Treat script/parser failures as blockers; the export step already validates assets.
          if grep -E 'SCRIPT ERROR:|Parse Error:' /tmp/godot-smoke.log; then
            echo "::error::Godot game script failed during startup"
            exit 1
          fi
          echo "Godot startup smoke test passed"
          echo "Run gameplay integration tests"
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://smoke_test.gd 2>&1 | tee /tmp/godot-gameplay-test.log
          grep -Fq "LEARNQUEST SMOKE TEST PASSED" /tmp/godot-gameplay-test.log || { echo "::error::Gameplay checks did not complete"; exit 1; }
          echo "Gameplay integration tests passed"
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_original_body_skin_test.gd 2>&1 | tee /tmp/godot-original-body-skin.log
          grep -Fq "ORIGINAL BODY SKIN TEST PASSED" /tmp/godot-original-body-skin.log
          echo "Original glTF body skinning regression passed"
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_costume_skin_follow_test.gd 2>&1 | tee /tmp/godot-costume-skin-follow.log
          grep -Fq "COSTUME SKIN FOLLOW TEST PASSED" /tmp/godot-costume-skin-follow.log
          echo "Shared head, hair and costume skeleton pose regression passed"
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_sculpted_skinned_suit_test.gd 2>&1 | tee /tmp/godot-sculpted-suit.log
          grep -Fq "SCULPTED SUIT TEST PASSED" /tmp/godot-sculpted-suit.log
          echo "Sculpted 13-bone flight-suit skinning regression passed"
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_suit_visibility_test.gd 2>&1 | tee /tmp/godot-suit-visibility.log
          grep -Fq "SUIT VISIBILITY TEST PASSED" /tmp/godot-suit-visibility.log
          echo "V100 exposed skinned silhouette and duplicate shell regression passed"
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_body_choreography_test.gd 2>&1 | tee /tmp/godot-body-choreography.log
          grep -Fq 'BODY CHOREOGRAPHY TEST PASSED' /tmp/godot-body-choreography.log
          echo "V101 full-body choreography and landing regression passed"
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_skinned_face_test.gd 2>&1 | tee /tmp/godot-skinned-face.log
          grep -Fq 'SKINNED FACE TEST PASSED' /tmp/godot-skinned-face.log
          echo "V102 continuous head/neck GPU skinning regression passed"
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_skinned_hair_test.gd 2>&1 | tee /tmp/godot-skinned-hair.log
          grep -Fq 'SKINNED HAIR TEST PASSED' /tmp/godot-skinned-hair.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_closed_head_test.gd 2>&1 | tee /tmp/godot-closed-head.log
          grep -Fq 'CLOSED HEAD TEST PASSED' /tmp/godot-closed-head.log
          echo 'V105 360-degree skinned head regression passed'
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_skinned_upper_jacket_test.gd 2>&1 | tee /tmp/godot-skinned-upper-jacket.log
          grep -Fq 'SKINNED JACKET TEST PASSED' /tmp/godot-skinned-upper-jacket.log
          echo 'V106 original-skeleton upper jacket and collar regression passed'
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_skinned_armwear_test.gd 2>&1 | tee /tmp/godot-skinned-armwear.log
          grep -Fq 'SKINNED ARMWEAR TEST PASSED' /tmp/godot-skinned-armwear.log
          echo 'V107 organic original-skeleton sleeves and cuffs regression passed'
          echo "V104 volumetric hair geometry, duplicate-retirement and original skinning regression passed"
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_legacy_head_retirement_test.gd 2>&1 | tee /tmp/godot-head-replacement.log
          grep -Fq 'HEAD REPLACEMENT TEST PASSED' /tmp/godot-head-replacement.log
          echo 'V108 old glTF head occlusion regression passed'
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_head_collar_silhouette_test.gd 2>&1 | tee /tmp/godot-head-collar-silhouette.log
          grep -Fq 'HEAD/COLLAR SILHOUETTE TEST PASSED' /tmp/godot-head-collar-silhouette.log
          echo 'V109 rounded cranial volume and lowered V-neck regression passed'
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_volumetric_fringe_test.gd 2>&1 | tee /tmp/godot-volumetric-fringe.log
          grep -Fq 'VOLUMETRIC FRINGE TEST PASSED' /tmp/godot-volumetric-fringe.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_shoulder_seam_test.gd 2>&1 | tee /tmp/godot-shoulder-seam.log
          grep -Fq 'SHOULDER SEAM TEST PASSED' /tmp/godot-shoulder-seam.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_sail_silhouette_test.gd 2>&1 | tee /tmp/godot-sail-silhouette.log
          grep -Fq 'SAIL SILHOUETTE TEST PASSED' /tmp/godot-sail-silhouette.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_skinned_gloves_test.gd 2>&1 | tee /tmp/godot-skinned-gloves.log
          grep -Fq 'SKINNED GLOVE TEST PASSED' /tmp/godot-skinned-gloves.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://hoverboard_sculpted_hull_test.gd 2>&1 | tee /tmp/godot-sculpted-hoverboard.log
          grep -Fq 'SCULPTED HOVERBOARD TEST PASSED' /tmp/godot-sculpted-hoverboard.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://powerup_vfx_test.gd 2>&1 | tee /tmp/godot-powerup-vfx.log
          grep -Fq 'POWERUP VFX TEST PASSED' /tmp/godot-powerup-vfx.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://cinematic_city_districts_test.gd 2>&1 | tee /tmp/godot-city-districts.log
          grep -Fq 'NEON DISTRICTS TEST PASSED' /tmp/godot-city-districts.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://cinematic_city_lightfields_test.gd 2>&1 | tee /tmp/godot-city-lightfields.log
          grep -Fq 'CITY LIGHTFIELDS TEST PASSED' /tmp/godot-city-lightfields.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://cinematic_canyon_geodes_test.gd 2>&1 | tee /tmp/godot-canyon-geodes.log
          grep -Fq 'CANYON GEODES TEST PASSED' /tmp/godot-canyon-geodes.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://canyon_route_choices_test.gd 2>&1 | tee /tmp/godot-canyon-routes.log
          grep -Fq 'CANYON ROUTES TEST PASSED' /tmp/godot-canyon-routes.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://cinematic_harbor_drydocks_test.gd 2>&1 | tee /tmp/godot-harbor-drydocks.log
          grep -Fq 'HARBOR DRYDOCKS TEST PASSED' /tmp/godot-harbor-drydocks.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://harbor_cargo_relay_test.gd 2>&1 | tee /tmp/godot-harbor-relay.log
          grep -Fq 'HARBOR CARGO RELAY TEST PASSED' /tmp/godot-harbor-relay.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://neon_signal_chain_test.gd 2>&1 | tee /tmp/godot-neon-signal-chain.log
          grep -Fq 'NEON SIGNAL CHAIN TEST PASSED' /tmp/godot-neon-signal-chain.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://neon_conductor_test.gd 2>&1 | tee /tmp/godot-neon-conductor.log
          grep -Fq 'NEON CONDUCTOR TEST PASSED' /tmp/godot-neon-conductor.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://aurora_slipstream_test.gd 2>&1 | tee /tmp/godot-aurora-slipstream.log
          grep -Fq 'AURORA SLIPSTREAM TEST PASSED' /tmp/godot-aurora-slipstream.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://aurora_perfect_line_test.gd 2>&1 | tee /tmp/godot-aurora-perfect-line.log
          grep -Fq 'AURORA PERFECT LINE TEST PASSED' /tmp/godot-aurora-perfect-line.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_skinned_lower_body_test.gd 2>&1 | tee /tmp/godot-skinned-lower-body.log
          grep -Fq 'SKINNED LOWER BODY TEST PASSED' /tmp/godot-skinned-lower-body.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_aero_silhouette_test.gd 2>&1 | tee /tmp/godot-aero-silhouette.log
          grep -Fq 'AERO SILHOUETTE TEST PASSED' /tmp/godot-aero-silhouette.log
          echo 'V111 shoulder/wrist seam regression passed'
          echo 'V110 four true 3D skinned forehead locks and scalp clearance regression passed'
          # GitHub Pages deploys replace the whole website. Preserve the actual
          # published older builds instead of silently replacing their contents.
          # Sprint 1 visual QA: produce real GPU-rendered, landscape screenshots.
          # This does NOT certify iPhone FPS or a clipping-free character.
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          fi
          mkdir -p /tmp/learnquest-visual-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_VISUAL_OUTPUT=/tmp/learnquest-visual-qa \
            timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://rider_visual_capture_test.gd 2>&1 | tee /tmp/godot-visual-capture.log
          grep -Fq 'VISUAL CAPTURE TEST PASSED' /tmp/godot-visual-capture.log
          test "$(find /tmp/learnquest-visual-qa -name '*.png' | wc -l)" -eq 20
          mkdir -p /tmp/learnquest-powerup-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_POWERUP_OUTPUT=/tmp/learnquest-powerup-qa \
            timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://powerup_visual_capture_test.gd 2>&1 | tee /tmp/godot-powerup-visual.log
          grep -Fq 'POWERUP VISUAL QA PASSED' /tmp/godot-powerup-visual.log
          test "$(find /tmp/learnquest-powerup-qa -name '*.png' | wc -l)" -eq 8
          mkdir -p /tmp/learnquest-city-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_CITY_OUTPUT=/tmp/learnquest-city-qa \
            timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://cinematic_city_visual_capture_test.gd 2>&1 | tee /tmp/godot-city-visual.log
          grep -Fq 'CITY VISUAL QA PASSED' /tmp/godot-city-visual.log
          test "$(find /tmp/learnquest-city-qa -name '*.png' | wc -l)" -eq 8
          mkdir -p /tmp/learnquest-lightfields-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_LIGHTFIELDS_OUTPUT=/tmp/learnquest-lightfields-qa \
            timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://cinematic_city_lightfields_visual_capture_test.gd 2>&1 | tee /tmp/godot-city-lightfields-visual.log
          grep -Fq 'CITY LIGHTFIELDS VISUAL QA PASSED' /tmp/godot-city-lightfields-visual.log
          test "$(find /tmp/learnquest-lightfields-qa -name '*.png' | wc -l)" -eq 8
          mkdir -p /tmp/learnquest-canyon-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_CANYON_OUTPUT=/tmp/learnquest-canyon-qa \
            timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://cinematic_canyon_geodes_visual_capture_test.gd 2>&1 | tee /tmp/godot-canyon-geodes-visual.log
          grep -Fq 'CANYON GEODES VISUAL QA PASSED' /tmp/godot-canyon-geodes-visual.log
          test "$(find /tmp/learnquest-canyon-qa -name '*.png' | wc -l)" -eq 8
          mkdir -p /tmp/learnquest-routes-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_ROUTES_OUTPUT=/tmp/learnquest-routes-qa \
            timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://canyon_route_choices_visual_capture_test.gd 2>&1 | tee /tmp/godot-canyon-routes-visual.log
          grep -Fq 'CANYON ROUTES VISUAL QA PASSED' /tmp/godot-canyon-routes-visual.log
          test "$(find /tmp/learnquest-routes-qa -name '*.png' | wc -l)" -eq 8
          mkdir -p /tmp/learnquest-harbor-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_HARBOR_OUTPUT=/tmp/learnquest-harbor-qa \
            timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://cinematic_harbor_drydocks_visual_capture_test.gd 2>&1 | tee /tmp/godot-harbor-drydocks-visual.log
          grep -Fq 'HARBOR DRYDOCKS VISUAL QA PASSED' /tmp/godot-harbor-drydocks-visual.log
          test "$(find /tmp/learnquest-harbor-qa -name '*.png' | wc -l)" -eq 8
          mkdir -p /tmp/learnquest-relay-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_RELAY_OUTPUT=/tmp/learnquest-relay-qa \
            timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://harbor_cargo_relay_visual_capture_test.gd 2>&1 | tee /tmp/godot-harbor-relay-visual.log
          grep -Fq 'HARBOR CARGO RELAY VISUAL QA PASSED' /tmp/godot-harbor-relay-visual.log
          test "$(find /tmp/learnquest-relay-qa -name '*.png' | wc -l)" -eq 8
          mkdir -p /tmp/learnquest-conductor-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_CONDUCTOR_OUTPUT=/tmp/learnquest-conductor-qa \
            timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://neon_conductor_visual_capture_test.gd 2>&1 | tee /tmp/godot-neon-conductor-visual.log
          grep -Fq 'NEON CONDUCTOR VISUAL QA PASSED' /tmp/godot-neon-conductor-visual.log
          mkdir -p /tmp/learnquest-slipstream-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_SLIPSTREAM_OUTPUT=/tmp/learnquest-slipstream-qa \
            timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://aurora_slipstream_visual_capture_test.gd 2>&1 | tee /tmp/godot-aurora-slipstream-visual.log
          grep -Fq 'AURORA SLIPSTREAM VISUAL QA PASSED' /tmp/godot-aurora-slipstream-visual.log
          test "$(find /tmp/learnquest-slipstream-qa -name '*.png' | wc -l)" -eq 8
          test "$(find /tmp/learnquest-conductor-qa -name '*.png' | wc -l)" -eq 8
          python .github/scripts/preserve_legacy_pages.py
          # Never overwrite previously published versions.
          # Every future release must deliberately use a new URL.
          python - <<'PY'
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          url = "https://mtothek0703.github.io/learnquest-unity-web/skyway-v128/index.html"
          try:
              with urlopen(Request(url, headers={"Cache-Control": "no-cache"}), timeout=20):
                  raise SystemExit("Skyway V128 already exists: refusing to overwrite an immutable release")
          except HTTPError as error:
              if error.code != 404:
                  raise
          print("Skyway V128 is not published yet; safe to create")
          PY
          # Each release gets a fresh URL; historical folders are never rebuilt from newer exports.
          mkdir -p _site/skyway-v128
          cp -a _site/godot/. _site/skyway-v128/
          echo "$GITHUB_SHA" > _site/skyway-v128/build.txt
          echo "$GITHUB_SHA" > _site/godot/build.txt
          echo "Archived previous versions and prepared immutable Skyway V128"
      - name: Check browser export integrity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path("_site/skyway-v128")
          for name in ("index.html", "index.js", "index.wasm", "index.pck"):
              file = root / name
              if not file.is_file() or file.stat().st_size == 0:
                  raise SystemExit(f"Missing/empty Godot export: {file}")
              print(f"Verified {file}: {file.stat().st_size:,} bytes")
          # The generated Godot HTML varies with engine and template versions:
          # checking for exact text snippets here creates false build failures.
          # The reliable contract is that all exported engine files exist.
          PY
      - name: Upload Godot build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-build-diagnostics
          path: |
            /tmp/godot-smoke.log
            /tmp/godot-import.log
            /tmp/godot-export.log
            /tmp/godot-gameplay-test.log
            /tmp/godot-original-body-skin.log
            /tmp/godot-costume-skin-follow.log
            /tmp/godot-sculpted-suit.log
            /tmp/godot-suit-visibility.log
            /tmp/godot-body-choreography.log
            /tmp/godot-skinned-face.log
            /tmp/godot-skinned-hair.log
            /tmp/godot-closed-head.log
            /tmp/godot-skinned-upper-jacket.log
            /tmp/godot-skinned-armwear.log
            /tmp/godot-visual-capture.log
            /tmp/godot-head-replacement.log
            /tmp/godot-head-collar-silhouette.log
            /tmp/godot-volumetric-fringe.log

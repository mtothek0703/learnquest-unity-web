name: Publish LearnQuest Web Games
on:
  push:
    branches: [main]
    paths:
      - 'LearnQuest3D_WebGL_Testfix.zip'
      - 'godot/**'
      - '.github/scripts/prepare_webgl.py'
      - '.github/workflows/publish-unity-webgl.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Unity website
        # The archived Unity demo is optional; a broken or missing archive must
        # not prevent publishing the actively maintained Godot game.
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check brotli
          python .github/scripts/prepare_webgl.py LearnQuest3D_WebGL_Testfix.zip _site
      - name: Install free Godot editor and web export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Export Godot browser game
        shell: bash
        run: |
          # Do not let tee conceal a failed Godot import, export or gameplay test.
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/_site/godot"
          echo "Import Godot project and capture errors"
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path godot --quit 2>&1 | tee /tmp/godot-import.log
          echo "Export self-contained Godot browser build"
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --export-release "Web" "$GITHUB_WORKSPACE/_site/godot/index.html" 2>&1 | tee /tmp/godot-export.log
          test -s _site/godot/index.html
          test -s _site/godot/index.wasm
          test -s _site/godot/index.pck
          echo "Godot import/export finished with nonempty web files"
          echo "Run Godot scene smoke test"
          set +e
          timeout 35s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --quit-after 15 > /tmp/godot-smoke.log 2>&1
          smoke_status=$?
          set -e
          cat /tmp/godot-smoke.log
          if [ "$smoke_status" -ne 0 ]; then
            echo "::error::Godot smoke test exited with status $smoke_status"
            exit 1
          fi
          # Runtime warnings from the headless graphics driver are not gameplay failures.
          # Treat script/parser failures as blockers; the export step already validates assets.
          if grep -E 'SCRIPT ERROR:|Parse Error:' /tmp/godot-smoke.log; then
            echo "::error::Godot game script failed during startup"
            exit 1
          fi
          echo "Godot startup smoke test passed"
          echo "Run gameplay integration tests"
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://smoke_test.gd 2>&1 | tee /tmp/godot-gameplay-test.log
          grep -Fq "LEARNQUEST SMOKE TEST PASSED" /tmp/godot-gameplay-test.log || { echo "::error::Gameplay checks did not complete"; exit 1; }
          echo "Gameplay integration tests passed"
          # Fresh asset path bypasses cached Godot .wasm/.pck from earlier deployments.
          mkdir -p _site/neon-city-v3
          cp -a _site/godot/. _site/neon-city-v3/
          mkdir -p _site/neon-city-v4
          cp -a _site/godot/. _site/neon-city-v4/
          mkdir -p _site/neon-city-v5
          cp -a _site/godot/. _site/neon-city-v5/
          mkdir -p _site/skyway-v6
          cp -a _site/godot/. _site/skyway-v6/
          mkdir -p _site/skyway-v7
          cp -a _site/godot/. _site/skyway-v7/
          mkdir -p _site/skyway-v8
          cp -a _site/godot/. _site/skyway-v8/
          mkdir -p _site/skyway-v9
          cp -a _site/godot/. _site/skyway-v9/
          test -s _site/skyway-v9/index.html
          test -s _site/skyway-v9/index.wasm
          test -s _site/skyway-v9/index.pck
          echo "Skyway V9 files prepared before Pages deployment"
          echo "$GITHUB_SHA" > _site/skyway-v9/build.txt
          echo "$GITHUB_SHA" > _site/skyway-v8/build.txt
          echo "$GITHUB_SHA" > _site/skyway-v7/build.txt
          echo "$GITHUB_SHA" > _site/skyway-v6/build.txt
          echo "$GITHUB_SHA" > _site/neon-city-v5/build.txt
          echo "$GITHUB_SHA" > _site/neon-city-v4/build.txt
          echo "$GITHUB_SHA" > _site/godot/build.txt
      - name: Check browser export integrity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          root = Path("_site/skyway-v9")
          required = ("index.html", "index.js", "index.wasm", "index.pck")
          for name in required:
              path = root / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Invalid Godot web export: missing or empty {path}")
              print(f"OK {path}: {path.stat().st_size:,} bytes")

          html = (root / "index.html").read_text(encoding="utf-8")
          if "index.js" not in html:
              raise SystemExit("Godot HTML does not reference the exported JavaScript")
          if "index.pck" not in html:
              raise SystemExit("Godot HTML does not reference the game package")
          print("Skyway V9 web export integrity passed")
          PY
      - name: Upload Godot build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-build-diagnostics
          path: |
            /tmp/godot-smoke.log
            /tmp/godot-import.log
            /tmp/godot-export.log
            /tmp/godot-gameplay-test.log
          if-no-files-found: ignore

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published game and revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, time, urllib.request
          root = "https://mtothek0703.github.io/learnquest-unity-web/skyway-v9/"
          checks = {"build.txt": os.environ["EXPECTED_SHA"], "index.html": None, "index.js": None, "index.wasm": None, "index.pck": None}
          for name, expected in checks.items():
              for attempt in range(12):
                  try:
                      req = urllib.request.Request(root + name + "?deploy=" + os.environ["EXPECTED_SHA"], headers={"Cache-Control": "no-cache"})
                      with urllib.request.urlopen(req, timeout=20) as response:
                          body = response.read() if expected else response.read(256)
                          if expected and body.decode().strip() != expected:
                              raise ValueError("Old revision still published")
                          if not body:
                              raise ValueError("Empty game file")
                          print(f"Verified {name}: HTTP {response.status}")
                          break
                  except Exception as exc:
                      if attempt == 11:
                          raise RuntimeError(f"Published game check failed for {name}: {exc}") from exc
                      time.sleep(10)
          PY

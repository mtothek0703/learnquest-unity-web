name: Godot PR validation
on:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-pr-check.yml'
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-pr-check.yml'
permissions:
  contents: read
jobs:
  godot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install free Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
      - name: Fetch and verify pinned CC0 humanoid for V124
        run: python3 .github/scripts/fetch_quaternius_hero.py
      - name: Import and test game without publishing
        shell: bash
        run: |
          set -euo pipefail
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --import 2>&1 | tee /tmp/import.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://smoke_test.gd 2>&1 | tee /tmp/gameplay.log
          grep -Fq 'LEARNQUEST SMOKE TEST PASSED' /tmp/gameplay.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_original_body_skin_test.gd 2>&1 | tee /tmp/original-body-skin.log
          grep -Fq 'ORIGINAL BODY SKIN TEST PASSED' /tmp/original-body-skin.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_external_character_test.gd 2>&1 | tee /tmp/quaternius-rig.log
          grep -Fq 'QUATERNIUS RIG TEST PASSED' /tmp/quaternius-rig.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_external_body_resculpt_test.gd 2>&1 | tee /tmp/continuous-body-resculpt.log
          grep -Fq 'CONTINUOUS BODY RESCULPT TEST PASSED' /tmp/continuous-body-resculpt.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_board_contact_test.gd 2>&1 | tee /tmp/board-contact.log
          grep -Fq 'RIDER BOARD CONTACT TEST PASSED' /tmp/board-contact.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_external_headgear_test.gd 2>&1 | tee /tmp/quaternius-headgear.log
          grep -Fq 'EXTERNAL HEADGEAR TEST PASSED' /tmp/quaternius-headgear.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_external_skinned_portrait_test.gd 2>&1 | tee /tmp/true-skinned-portrait.log
          grep -Fq 'TRUE SKINNED PORTRAIT TEST PASSED' /tmp/true-skinned-portrait.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_external_athletic_portrait_sculpt_test.gd 2>&1 | tee /tmp/athletic-portrait-sculpt.log
          grep -Fq 'ATHLETIC PORTRAIT SCULPT TEST PASSED' /tmp/athletic-portrait-sculpt.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_external_back_hair_sculpt_test.gd 2>&1 | tee /tmp/quaternius-back-hair-sculpt.log
          grep -Fq 'CONTINUOUS BACK HAIR SCULPT TEST PASSED' /tmp/quaternius-back-hair-sculpt.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_external_skinned_back_hair_test.gd 2>&1 | tee /tmp/quaternius-true-skinned-hair.log
          grep -Fq 'TRUE SKINNED BACK HAIR TEST PASSED' /tmp/quaternius-true-skinned-hair.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_external_hair_finish_test.gd 2>&1 | tee /tmp/weighted-hair-finish.log
          grep -Fq 'WEIGHTED HAIR FINISH TEST PASSED' /tmp/weighted-hair-finish.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_v124_integrated_silhouette_test.gd 2>&1 | tee /tmp/integrated-hero-silhouette.log
          grep -Fq 'INTEGRATED HERO SILHOUETTE TEST PASSED' /tmp/integrated-hero-silhouette.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_external_portrait_normals_test.gd 2>&1 | tee /tmp/quaternius-portrait-normals.log
          grep -Fq 'EXTERNAL PORTRAIT NORMALS TEST PASSED' /tmp/quaternius-portrait-normals.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_external_hair_dynamics_test.gd 2>&1 | tee /tmp/quaternius-hair-motion.log
          grep -Fq 'EXTERNAL HAIR DYNAMICS TEST PASSED' /tmp/quaternius-hair-motion.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_external_expression_test.gd 2>&1 | tee /tmp/quaternius-expression.log
          grep -Fq 'EXTERNAL EXPRESSION TEST PASSED' /tmp/quaternius-expression.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_external_silhouette_material_test.gd 2>&1 | tee /tmp/silhouette-material.log
          grep -Fq 'EXTERNAL SILHOUETTE MATERIAL TEST PASSED' /tmp/silhouette-material.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_external_helmet_contour_test.gd 2>&1 | tee /tmp/helmet-contour.log
          grep -Fq 'INTEGRATED HELMET TEST PASSED' /tmp/helmet-contour.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_external_skinned_neck_yoke_test.gd 2>&1 | tee /tmp/quaternius-neck-yoke.log
          grep -Fq 'EXTERNAL SKINNED NECK YOKE TEST PASSED' /tmp/quaternius-neck-yoke.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_external_skinned_outfit_test.gd 2>&1 | tee /tmp/quaternius-outfit.log
          grep -Fq 'EXTERNAL SKINNED OUTFIT TEST PASSED' /tmp/quaternius-outfit.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_external_skinned_armor_test.gd 2>&1 | tee /tmp/quaternius-armor.log
          grep -Fq 'EXTERNAL SKINNED ARMOR TEST PASSED' /tmp/quaternius-armor.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_external_skinned_harness_test.gd 2>&1 | tee /tmp/quaternius-harness.log
          grep -Fq 'EXTERNAL SKINNED HARNESS TEST PASSED' /tmp/quaternius-harness.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_external_athletic_pose_test.gd 2>&1 | tee /tmp/quaternius-pose.log
          grep -Fq 'EXTERNAL ATHLETIC POSE TEST PASSED' /tmp/quaternius-pose.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_external_follow_through_test.gd 2>&1 | tee /tmp/quaternius-follow-through.log
          grep -Fq 'EXTERNAL FOLLOW-THROUGH TEST PASSED' /tmp/quaternius-follow-through.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_external_skinned_sleeves_test.gd 2>&1 | tee /tmp/quaternius-sleeves.log
          grep -Fq 'EXTERNAL SKINNED SLEEVES TEST PASSED' /tmp/quaternius-sleeves.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_external_skinned_lower_test.gd 2>&1 | tee /tmp/quaternius-lower.log
          grep -Fq 'EXTERNAL SKINNED LOWER TEST PASSED' /tmp/quaternius-lower.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_external_skinned_mantle_test.gd 2>&1 | tee /tmp/quaternius-mantle.log
          grep -Fq 'EXTERNAL SKINNED MANTLE TEST PASSED' /tmp/quaternius-mantle.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_external_skinned_thrusters_test.gd 2>&1 | tee /tmp/quaternius-thrusters.log
          grep -Fq 'EXTERNAL SKINNED THRUSTERS TEST PASSED' /tmp/quaternius-thrusters.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_external_skinned_pauldron_test.gd 2>&1 | tee /tmp/quaternius-pauldron.log
          grep -Fq 'EXTERNAL PAULDRON TEST PASSED' /tmp/quaternius-pauldron.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_costume_skin_follow_test.gd 2>&1 | tee /tmp/costume-skin-follow.log
          grep -Fq 'COSTUME SKIN FOLLOW TEST PASSED' /tmp/costume-skin-follow.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_sculpted_skinned_suit_test.gd 2>&1 | tee /tmp/sculpted-suit.log
          grep -Fq 'SCULPTED SUIT TEST PASSED' /tmp/sculpted-suit.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_suit_visibility_test.gd 2>&1 | tee /tmp/suit-visibility.log
          grep -Fq 'SUIT VISIBILITY TEST PASSED' /tmp/suit-visibility.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_body_choreography_test.gd 2>&1 | tee /tmp/body-choreography.log
          grep -Fq 'BODY CHOREOGRAPHY TEST PASSED' /tmp/body-choreography.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_skinned_face_test.gd 2>&1 | tee /tmp/skinned-face.log
          grep -Fq 'SKINNED FACE TEST PASSED' /tmp/skinned-face.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_skinned_hair_test.gd 2>&1 | tee /tmp/skinned-hair.log
          grep -Fq 'SKINNED HAIR TEST PASSED' /tmp/skinned-hair.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_closed_head_test.gd 2>&1 | tee /tmp/closed-head.log
          grep -Fq 'CLOSED HEAD TEST PASSED' /tmp/closed-head.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_skinned_upper_jacket_test.gd 2>&1 | tee /tmp/skinned-upper-jacket.log
          grep -Fq 'SKINNED JACKET TEST PASSED' /tmp/skinned-upper-jacket.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_skinned_armwear_test.gd 2>&1 | tee /tmp/skinned-armwear.log
          grep -Fq 'SKINNED ARMWEAR TEST PASSED' /tmp/skinned-armwear.log
      - name: Verify the new skinned head is actually visible over original glTF
        shell: bash
        run: |
          set -euo pipefail
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_legacy_head_retirement_test.gd 2>&1 | tee /tmp/head-replacement.log
          grep -Fq 'HEAD REPLACEMENT TEST PASSED' /tmp/head-replacement.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_head_collar_silhouette_test.gd 2>&1 | tee /tmp/head-collar-silhouette.log
          grep -Fq 'HEAD/COLLAR SILHOUETTE TEST PASSED' /tmp/head-collar-silhouette.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_volumetric_fringe_test.gd 2>&1 | tee /tmp/volumetric-fringe.log
          grep -Fq 'VOLUMETRIC FRINGE TEST PASSED' /tmp/volumetric-fringe.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_shoulder_seam_test.gd 2>&1 | tee /tmp/shoulder-seam.log
          grep -Fq 'SHOULDER SEAM TEST PASSED' /tmp/shoulder-seam.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_sail_silhouette_test.gd 2>&1 | tee /tmp/sail-silhouette.log
          grep -Fq 'SAIL SILHOUETTE TEST PASSED' /tmp/sail-silhouette.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_skinned_gloves_test.gd 2>&1 | tee /tmp/skinned-gloves.log
          grep -Fq 'SKINNED GLOVE TEST PASSED' /tmp/skinned-gloves.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://hoverboard_sculpted_hull_test.gd 2>&1 | tee /tmp/sculpted-hoverboard.log
          grep -Fq 'SCULPTED HOVERBOARD TEST PASSED' /tmp/sculpted-hoverboard.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://hoverboard_boost_wake_test.gd 2>&1 | tee /tmp/boost-wake.log
          grep -Fq 'VOLUMETRIC BOOST WAKE TEST PASSED' /tmp/boost-wake.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://powerup_vfx_test.gd 2>&1 | tee /tmp/powerup-vfx.log
          grep -Fq 'POWERUP VFX TEST PASSED' /tmp/powerup-vfx.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://cinematic_city_districts_test.gd 2>&1 | tee /tmp/city-districts.log
          grep -Fq 'NEON DISTRICTS TEST PASSED' /tmp/city-districts.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://cinematic_city_lightfields_test.gd 2>&1 | tee /tmp/city-lightfields.log
          grep -Fq 'CITY LIGHTFIELDS TEST PASSED' /tmp/city-lightfields.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://cinematic_canyon_geodes_test.gd 2>&1 | tee /tmp/canyon-geodes.log
          grep -Fq 'CANYON GEODES TEST PASSED' /tmp/canyon-geodes.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://canyon_route_choices_test.gd 2>&1 | tee /tmp/canyon-routes.log
          grep -Fq 'CANYON ROUTES TEST PASSED' /tmp/canyon-routes.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://cinematic_harbor_drydocks_test.gd 2>&1 | tee /tmp/harbor-drydocks.log
          grep -Fq 'HARBOR DRYDOCKS TEST PASSED' /tmp/harbor-drydocks.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://harbor_cargo_relay_test.gd 2>&1 | tee /tmp/harbor-relay.log
          grep -Fq 'HARBOR CARGO RELAY TEST PASSED' /tmp/harbor-relay.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_skinned_lower_body_test.gd 2>&1 | tee /tmp/skinned-lower-body.log
          grep -Fq 'SKINNED LOWER BODY TEST PASSED' /tmp/skinned-lower-body.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_aero_silhouette_test.gd 2>&1 | tee /tmp/aero-silhouette.log
          grep -Fq 'AERO SILHOUETTE TEST PASSED' /tmp/aero-silhouette.log
      - name: Validate web export before any main-branch deployment
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          mkdir -p /tmp/learnquest-web
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --export-release Web /tmp/learnquest-web/index.html 2>&1 | tee /tmp/web-export.log
          for name in index.html index.js index.wasm index.pck; do test -s "/tmp/learnquest-web/$name"; done
      - name: Render actual character QA images in two smartphone landscape ratios
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          fi
          mkdir -p /tmp/learnquest-visual-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_VISUAL_OUTPUT=/tmp/learnquest-visual-qa \
            timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://rider_visual_capture_test.gd 2>&1 | tee /tmp/visual-capture.log
          grep -Fq 'VISUAL CAPTURE TEST PASSED' /tmp/visual-capture.log
          test "$(find /tmp/learnquest-visual-qa -name '*.png' | wc -l)" -eq 20
      - name: Render real V123/V124 rigged hero landscape comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/learnquest-quaternius-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_QUATERNIUS_OUTPUT=/tmp/learnquest-quaternius-qa \
            timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://rider_external_character_visual_capture_test.gd 2>&1 | tee /tmp/quaternius-visual.log
          grep -Fq 'QUATERNIUS VISUAL QA PASSED' /tmp/quaternius-visual.log
          test "$(find /tmp/learnquest-quaternius-qa -name '*.png' | wc -l)" -eq 24
      - name: Capture 24 pose-locked source, skinned outfit and complete hero comparison frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/learnquest-body-sculpt-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_BODY_SCULPT_OUTPUT=/tmp/learnquest-body-sculpt-qa \
            timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://rider_external_body_resculpt_visual_capture_test.gd 2>&1 | tee /tmp/body-sculpt-visual.log
          grep -Fq 'CONTINUOUS BODY VISUAL QA PASSED' /tmp/body-sculpt-visual.log
          test "$(find /tmp/learnquest-body-sculpt-qa -name '*.png' | wc -l)" -eq 24
      - name: Capture 16 pose-locked skinned sleeve silhouette comparisons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/learnquest-sleeves-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_SLEEVES_OUTPUT=/tmp/learnquest-sleeves-qa \
            timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://rider_external_skinned_sleeves_visual_capture_test.gd 2>&1 | tee /tmp/sleeves-visual.log
          grep -Fq 'SKINNED SLEEVE VISUAL QA PASSED' /tmp/sleeves-visual.log
          test "$(find /tmp/learnquest-sleeves-qa -name '*.png' | wc -l)" -eq 16
      - name: Capture 12 true skinned portrait versus rigid face landscape frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/learnquest-skinned-portrait-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_PORTRAIT_OUTPUT=/tmp/learnquest-skinned-portrait-qa \
            timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://rider_external_skinned_portrait_visual_capture_test.gd 2>&1 | tee /tmp/skinned-portrait-visual.log
          grep -Fq 'TRUE SKINNED PORTRAIT VISUAL QA PASSED' /tmp/skinned-portrait-visual.log
          test "$(find /tmp/learnquest-skinned-portrait-qa -name '*.png' | wc -l)" -eq 12
      - name: Compare rigid versus genuinely skinned rear hair in 16 landscape frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/learnquest-skinned-hair-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_SKINNED_HAIR_OUTPUT=/tmp/learnquest-skinned-hair-qa \
            timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://rider_external_skinned_back_hair_visual_capture_test.gd 2>&1 | tee /tmp/skinned-hair-visual.log
          grep -Fq 'SKINNED BACK HAIR VISUAL QA PASSED' /tmp/skinned-hair-visual.log
          test "$(find /tmp/learnquest-skinned-hair-qa -name '*.png' | wc -l)" -eq 18
      - name: Render 32 real V123/V124 neutral and action silhouette frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/learnquest-action-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_ACTION_OUTPUT=/tmp/learnquest-action-qa \
            timeout 150s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://rider_external_action_visual_capture_test.gd 2>&1 | tee /tmp/action-visual.log
          grep -Fq 'EXTERNAL ACTION SILHOUETTE QA PASSED' /tmp/action-visual.log
          test "$(find /tmp/learnquest-action-qa -name '*.png' | wc -l)" -eq 32
      - name: Render actual V123/V124 skinned hoverboot close-ups at two landscape ratios
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/learnquest-boots-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_BOOT_OUTPUT=/tmp/learnquest-boots-qa \
            timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://rider_external_boot_visual_capture_test.gd 2>&1 | tee /tmp/boot-visual.log

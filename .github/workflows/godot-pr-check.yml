name: Godot PR validation
on:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-pr-check.yml'
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-pr-check.yml'
permissions:
  contents: read
jobs:
  godot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install free Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
      - name: Import and test game without publishing
        shell: bash
        run: |
          set -euo pipefail
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path godot --quit 2>&1 | tee /tmp/import.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://smoke_test.gd 2>&1 | tee /tmp/gameplay.log
          grep -Fq 'LEARNQUEST SMOKE TEST PASSED' /tmp/gameplay.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_original_body_skin_test.gd 2>&1 | tee /tmp/original-body-skin.log
          grep -Fq 'ORIGINAL BODY SKIN TEST PASSED' /tmp/original-body-skin.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_costume_skin_follow_test.gd 2>&1 | tee /tmp/costume-skin-follow.log
          grep -Fq 'COSTUME SKIN FOLLOW TEST PASSED' /tmp/costume-skin-follow.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_sculpted_skinned_suit_test.gd 2>&1 | tee /tmp/sculpted-suit.log
          grep -Fq 'SCULPTED SUIT TEST PASSED' /tmp/sculpted-suit.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_suit_visibility_test.gd 2>&1 | tee /tmp/suit-visibility.log
          grep -Fq 'SUIT VISIBILITY TEST PASSED' /tmp/suit-visibility.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_body_choreography_test.gd 2>&1 | tee /tmp/body-choreography.log
          grep -Fq 'BODY CHOREOGRAPHY TEST PASSED' /tmp/body-choreography.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_skinned_face_test.gd 2>&1 | tee /tmp/skinned-face.log
          grep -Fq 'SKINNED FACE TEST PASSED' /tmp/skinned-face.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_skinned_hair_test.gd 2>&1 | tee /tmp/skinned-hair.log
          grep -Fq 'SKINNED HAIR TEST PASSED' /tmp/skinned-hair.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_closed_head_test.gd 2>&1 | tee /tmp/closed-head.log
          grep -Fq 'CLOSED HEAD TEST PASSED' /tmp/closed-head.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_skinned_upper_jacket_test.gd 2>&1 | tee /tmp/skinned-upper-jacket.log
          grep -Fq 'SKINNED JACKET TEST PASSED' /tmp/skinned-upper-jacket.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_skinned_armwear_test.gd 2>&1 | tee /tmp/skinned-armwear.log
          grep -Fq 'SKINNED ARMWEAR TEST PASSED' /tmp/skinned-armwear.log
      - name: Verify the new skinned head is actually visible over original glTF
        shell: bash
        run: |
          set -euo pipefail
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_legacy_head_retirement_test.gd 2>&1 | tee /tmp/head-replacement.log
          grep -Fq 'HEAD REPLACEMENT TEST PASSED' /tmp/head-replacement.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_head_collar_silhouette_test.gd 2>&1 | tee /tmp/head-collar-silhouette.log
          grep -Fq 'HEAD/COLLAR SILHOUETTE TEST PASSED' /tmp/head-collar-silhouette.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_volumetric_fringe_test.gd 2>&1 | tee /tmp/volumetric-fringe.log
          grep -Fq 'VOLUMETRIC FRINGE TEST PASSED' /tmp/volumetric-fringe.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_shoulder_seam_test.gd 2>&1 | tee /tmp/shoulder-seam.log
          grep -Fq 'SHOULDER SEAM TEST PASSED' /tmp/shoulder-seam.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_sail_silhouette_test.gd 2>&1 | tee /tmp/sail-silhouette.log
          grep -Fq 'SAIL SILHOUETTE TEST PASSED' /tmp/sail-silhouette.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_skinned_gloves_test.gd 2>&1 | tee /tmp/skinned-gloves.log
          grep -Fq 'SKINNED GLOVE TEST PASSED' /tmp/skinned-gloves.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://hoverboard_sculpted_hull_test.gd 2>&1 | tee /tmp/sculpted-hoverboard.log
          grep -Fq 'SCULPTED HOVERBOARD TEST PASSED' /tmp/sculpted-hoverboard.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://powerup_vfx_test.gd 2>&1 | tee /tmp/powerup-vfx.log
          grep -Fq 'POWERUP VFX TEST PASSED' /tmp/powerup-vfx.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://cinematic_city_districts_test.gd 2>&1 | tee /tmp/city-districts.log
          grep -Fq 'NEON DISTRICTS TEST PASSED' /tmp/city-districts.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://cinematic_city_lightfields_test.gd 2>&1 | tee /tmp/city-lightfields.log
          grep -Fq 'CITY LIGHTFIELDS TEST PASSED' /tmp/city-lightfields.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://cinematic_canyon_geodes_test.gd 2>&1 | tee /tmp/canyon-geodes.log
          grep -Fq 'CANYON GEODES TEST PASSED' /tmp/canyon-geodes.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://canyon_route_choices_test.gd 2>&1 | tee /tmp/canyon-routes.log
          grep -Fq 'CANYON ROUTES TEST PASSED' /tmp/canyon-routes.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://cinematic_harbor_drydocks_test.gd 2>&1 | tee /tmp/harbor-drydocks.log
          grep -Fq 'HARBOR DRYDOCKS TEST PASSED' /tmp/harbor-drydocks.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_skinned_lower_body_test.gd 2>&1 | tee /tmp/skinned-lower-body.log
          grep -Fq 'SKINNED LOWER BODY TEST PASSED' /tmp/skinned-lower-body.log
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://rider_aero_silhouette_test.gd 2>&1 | tee /tmp/aero-silhouette.log
          grep -Fq 'AERO SILHOUETTE TEST PASSED' /tmp/aero-silhouette.log
      - name: Validate web export before any main-branch deployment
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          mkdir -p /tmp/learnquest-web
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --export-release Web /tmp/learnquest-web/index.html 2>&1 | tee /tmp/web-export.log
          for name in index.html index.js index.wasm index.pck; do test -s "/tmp/learnquest-web/$name"; done
      - name: Render actual character QA images in two smartphone landscape ratios
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          fi
          mkdir -p /tmp/learnquest-visual-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_VISUAL_OUTPUT=/tmp/learnquest-visual-qa \
            timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://rider_visual_capture_test.gd 2>&1 | tee /tmp/visual-capture.log
          grep -Fq 'VISUAL CAPTURE TEST PASSED' /tmp/visual-capture.log
          test "$(find /tmp/learnquest-visual-qa -name '*.png' | wc -l)" -eq 20
      - name: Render all four power-up silhouettes for 16:9 QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/learnquest-powerup-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_POWERUP_OUTPUT=/tmp/learnquest-powerup-qa \
            timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://powerup_visual_capture_test.gd 2>&1 | tee /tmp/powerup-visual.log
          grep -Fq 'POWERUP VISUAL QA PASSED' /tmp/powerup-visual.log
          test "$(find /tmp/learnquest-powerup-qa -name '*.png' | wc -l)" -eq 8
      - name: Render Neon City before-after 16:9 / 19.5:9 frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/learnquest-city-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_CITY_OUTPUT=/tmp/learnquest-city-qa \
            timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://cinematic_city_visual_capture_test.gd 2>&1 | tee /tmp/city-visual.log
          grep -Fq 'CITY VISUAL QA PASSED' /tmp/city-visual.log
          test "$(find /tmp/learnquest-city-qa -name '*.png' | wc -l)" -eq 8
      - name: Render V119 lightfield before-after landscape frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/learnquest-lightfields-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_LIGHTFIELDS_OUTPUT=/tmp/learnquest-lightfields-qa \
            timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://cinematic_city_lightfields_visual_capture_test.gd 2>&1 | tee /tmp/city-lightfields-visual.log
          grep -Fq 'CITY LIGHTFIELDS VISUAL QA PASSED' /tmp/city-lightfields-visual.log
          test "$(find /tmp/learnquest-lightfields-qa -name '*.png' | wc -l)" -eq 8
      - name: Render V120 Canyon geodes before-after landscape frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/learnquest-canyon-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_CANYON_OUTPUT=/tmp/learnquest-canyon-qa \
            timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://cinematic_canyon_geodes_visual_capture_test.gd 2>&1 | tee /tmp/canyon-geodes-visual.log
          grep -Fq 'CANYON GEODES VISUAL QA PASSED' /tmp/canyon-geodes-visual.log
          test "$(find /tmp/learnquest-canyon-qa -name '*.png' | wc -l)" -eq 8
      - name: Render V121 playable route portals in both smartphone landscape ratios
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/learnquest-routes-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_ROUTES_OUTPUT=/tmp/learnquest-routes-qa \
            timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://canyon_route_choices_visual_capture_test.gd 2>&1 | tee /tmp/canyon-routes-visual.log
          grep -Fq 'CANYON ROUTES VISUAL QA PASSED' /tmp/canyon-routes-visual.log
          test "$(find /tmp/learnquest-routes-qa -name '*.png' | wc -l)" -eq 8
      - name: Render V122 Star Harbor drydock before-after landscape frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/learnquest-harbor-qa
          LIBGL_ALWAYS_SOFTWARE=1 LEARNQUEST_HARBOR_OUTPUT=/tmp/learnquest-harbor-qa \
            timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --script res://cinematic_harbor_drydocks_visual_capture_test.gd 2>&1 | tee /tmp/harbor-drydocks-visual.log
          grep -Fq 'HARBOR DRYDOCKS VISUAL QA PASSED' /tmp/harbor-drydocks-visual.log
          test "$(find /tmp/learnquest-harbor-qa -name '*.png' | wc -l)" -eq 8
      - name: Upload V122 Star Harbor drydock comparison frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnquest-v122-harbor-drydocks-before-after
          path: /tmp/learnquest-harbor-qa/*.png
          if-no-files-found: error
      - name: Upload V121 playable route comparison frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnquest-v121-canyon-routes-before-after
          path: /tmp/learnquest-routes-qa/*.png
          if-no-files-found: error
      - name: Upload V120 Canyon geode comparison frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnquest-v120-canyon-geodes-before-after
          path: /tmp/learnquest-canyon-qa/*.png
          if-no-files-found: error
      - name: Upload V119 lightfield comparison frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnquest-v119-lightfields-before-after
          path: /tmp/learnquest-lightfields-qa/*.png
          if-no-files-found: error
      - name: Upload Neon City comparison frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnquest-v118-neon-city-before-after
          path: /tmp/learnquest-city-qa/*.png
          if-no-files-found: error
      - name: Upload power-up comparison frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnquest-powerup-frames
          path: /tmp/learnquest-powerup-qa/*.png
          if-no-files-found: ignore
      - name: Upload rendered visual QA frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnquest-landscape-character-frames
          path: /tmp/learnquest-visual-qa/*.png
          if-no-files-found: ignore
      - name: Save test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-pr-logs
          path: |
            /tmp/import.log
            /tmp/gameplay.log
            /tmp/original-body-skin.log
            /tmp/costume-skin-follow.log
            /tmp/sculpted-suit.log
            /tmp/suit-visibility.log
            /tmp/body-choreography.log
            /tmp/skinned-face.log
            /tmp/skinned-hair.log
            /tmp/closed-head.log
            /tmp/skinned-upper-jacket.log
            /tmp/skinned-armwear.log
            /tmp/web-export.log
            /tmp/visual-capture.log
            /tmp/head-replacement.log
            /tmp/head-collar-silhouette.log
            /tmp/volumetric-fringe.log
            /tmp/shoulder-seam.log
            /tmp/sail-silhouette.log
            /tmp/sculpted-hoverboard.log
            /tmp/powerup-vfx.log
            /tmp/powerup-visual.log
            /tmp/city-districts.log
            /tmp/city-visual.log
            /tmp/city-lightfields.log
            /tmp/city-lightfields-visual.log
            /tmp/canyon-geodes.log
            /tmp/canyon-routes.log
            /tmp/harbor-drydocks.log
            /tmp/harbor-drydocks-visual.log
            /tmp/canyon-routes-visual.log
            /tmp/canyon-geodes-visual.log
            /tmp/aero-silhouette.log
          if-no-files-found: ignore

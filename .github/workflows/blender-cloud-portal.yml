name: Blender Cloud – LearnQuest 3D portal asset

on:
  push:
    branches:
      - feature/blender-cloud-portal
      - feature/blender-learnquest-integration
    paths:
      - .github/workflows/blender-cloud-portal.yml
      - tools/blender/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blender-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-portal:
    name: Create and validate Blender asset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender from Ubuntu packages
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender python3-numpy python3-pil
          blender --version | head -n 2

      - name: Generate model and preview (CPU only)
        run: |
          set -euo pipefail
          mkdir -p out/blender
          blender --background --factory-startup --python-exit-code 1 --threads 2 \
            --python tools/blender/make_portal.py -- \
            --output-dir "$GITHUB_WORKSPACE/out/blender"

      - name: Validate GLB, Blender project and preview
        run: |
          set -euo pipefail
          python3 tools/blender/validate_output.py out/blender

      - name: Upload generated 3D files
        uses: actions/upload-artifact@v4
        with:
          name: learnquest-blender-portal
          path: |
            out/blender/learnquest_portal.glb
            out/blender/learnquest_portal.blend
            out/blender/portal_preview.png
            out/blender/manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

      - name: Commit generated asset to feature branch only
        if: github.ref == 'refs/heads/feature/blender-learnquest-integration' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/assets/3d
          cp out/blender/learnquest_portal.glb godot/assets/3d/learnquest_portal.glb
          cp out/blender/portal_preview.png godot/assets/3d/learnquest_portal_preview.png
          git add godot/assets/3d/learnquest_portal.glb godot/assets/3d/learnquest_portal_preview.png
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'assets: Blender portal prototype [skip ci]'
            git push origin HEAD:feature/blender-learnquest-integration
          fi

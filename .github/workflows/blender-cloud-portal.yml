name: Blender Cloud – LearnQuest 3D portal asset

on:
  push:
    branches:
      - feature/blender-cloud-portal
    paths:
      - .github/workflows/blender-cloud-portal.yml
      - tools/blender/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blender-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-portal:
    name: Create and validate Blender asset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender from Ubuntu packages
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender python3-numpy python3-pil
          blender --version | head -n 2

      - name: Generate model and preview (CPU only)
        run: |
          set -euo pipefail
          mkdir -p out/blender
          blender --background --factory-startup --python-exit-code 1 --threads 2 \
            --python tools/blender/make_portal.py -- \
            --output-dir "$GITHUB_WORKSPACE/out/blender"

      - name: Validate GLB, Blender project and preview
        run: |
          set -euo pipefail
          python3 tools/blender/validate_output.py out/blender

      - name: Upload generated 3D files
        uses: actions/upload-artifact@v4
        with:
          name: learnquest-blender-portal
          path: |
            out/blender/learnquest_portal.glb
            out/blender/learnquest_portal.blend
            out/blender/portal_preview.png
            out/blender/manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
